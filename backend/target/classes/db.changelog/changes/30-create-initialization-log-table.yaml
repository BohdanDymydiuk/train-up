databaseChangeLog:
  - changeSet:
      id: 30-create-initialization-log-table
      author: Bohdan-S
      changes:
        - createTable:
            tableName: initialization_log
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: initialization_type
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: executed_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
